<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Newsletter title</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
  <!-- Preheader (hidden in many clients; shows in inbox preview) -->
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    Short preview text for the inbox.
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <!-- Main container: 600px is a safe default for Outlook -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;background-color:#ffffff;">
          <!-- Header -->
          <tr>
            <td style="padding:24px 32px;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:32px;color:#111111;font-weight:bold;">
              Your headline
            </td>
          </tr>
          <!-- Hero image: use absolute HTTPS URL in production -->
          <tr>
            <td style="padding:0 32px;">
              <img src="https://via.placeholder.com/536x200" width="536" alt="Describe the image" style="display:block;width:100%;max-width:536px;height:auto;border:0;">
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:24px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#333333;">
              <p style="margin:0 0 16px 0;">Replace this paragraph with your newsletter content. Keep paragraphs short for mobile readers.</p>
              <p style="margin:0;">Second paragraph optional.</p>
            </td>
          </tr>
          <!-- CTA button (table-based for Outlook) -->
          <tr>
            <td align="center" style="padding:8px 32px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#0066cc" style="border-radius:4px;background-color:#0066cc;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="https://example.com" style="height:44px;v-text-anchor:middle;width:200px;" arcsize="10%" strokecolor="#0066cc" fillcolor="#0066cc">
                      <w:anchorlock/>
                      <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">Call to action</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="https://example.com" target="_blank" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;background-color:#0066cc;border-radius:4px;">Call to action</a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#666666;border-top:1px solid #eeeeee;">
              Company name · <a href="https://example.com/unsubscribe" style="color:#666666;">Unsubscribe</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
